version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: coopuser
      POSTGRES_PASSWORD: cooppassword
      POSTGRES_DB: coopledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://coopuser:cooppassword@db:5432/coopledger?schema=public"
    depends_on:
      - db

volumes:
  postgres_data:
